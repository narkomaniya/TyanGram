name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Prepare local.properties
        run: |
          # Telegram build expects local.properties in root; provide placeholders.
          # Real API_ID/API_HASH can be added as repository secrets and written here.
          cat > local.properties <<'EOF'
          sdk.dir=$ANDROID_SDK_ROOT
          EOF

      - name: Build debug APK (best effort)
        run: |
          chmod +x ./gradlew || true
          ./gradlew :TMessagesProj_App:assembleDebug --stacktrace || ./gradlew :TMessagesProj_AppStandalone:assembleStandalone --stacktrace

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TyanGram-apk
          path: |
            **/outputs/apk/**/*.apk
          if-no-files-found: warn
